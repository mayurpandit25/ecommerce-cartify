apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartify-stable
  namespace: ecommerce-cartify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cartify-stable
  template:
    metadata:
      labels:
        app: cartify-stable
        version: v1
    spec:
      containers:
        - name: cartify
          image: mayurpandit25/ecommerce-cartify:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
