apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-cartify

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce-cartify

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: ecommerce-cartify

    spec:
      containers:
        - name: ecommerce-cartify
          image: mayurpandit25/ecommerce-cartify:v1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP
