apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-cartify-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce-cartify-green

  template:
    metadata:
      labels:
        app: ecommerce-cartify-green
        version: green

    spec:
      containers:
        - name: ecommerce-cartify
          image: mayurpandit25/ecommerce-cartify:v2.0
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP
