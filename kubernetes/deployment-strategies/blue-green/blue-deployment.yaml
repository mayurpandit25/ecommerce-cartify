apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-cartify-blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce-cartify-blue

  template:
    metadata:
      labels:
        app: ecommerce-cartify-blue
        version: blue

    spec:
      containers:
        - name: ecommerce-cartify
          image: mayurpandit25/ecommerce-cartify:v1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP
